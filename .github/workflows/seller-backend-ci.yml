name: Seller Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'app/api/seller/**'
      - 'app/api/mobile/**'
      - 'lib/server-seller-os.ts'
      - 'lib/server-push.ts'
      - 'lib/server-r2.ts'
      - 'lib/server-groq.ts'
      - 'lib/server-auth.ts'
      - 'lib/firebase-admin.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/seller-backend-ci.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
